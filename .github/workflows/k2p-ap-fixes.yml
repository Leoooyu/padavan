name: Build K2P-NANO with AP fixes

# ===== 怎么用（不用改这个文件）=====
# 仓库页 → Actions → 左侧选 "Build K2P-NANO with AP fixes" → 右侧 Run workflow
#   → 机型保持默认 K2P-NANO（你的 AP 实测就是这个）→ 绿色 Run workflow 按钮
# 约 30~60 分钟（第二次起有 ccache 缓存，会快很多；期间可以关网页）
# 编好后在该次运行页面底部 Artifacts 里下载 → 得到 .trx
#
# 这个固件相对原版做了五件事：
#   1) 内置「AP 看门狗 + 可靠重启」（见 .github/patch_mtd_storage.py）
#   2) 去掉「QoS 限速」(SQM)：包不编译、网页页面删掉、菜单项消失
#   3) 无线默认值对齐主路由 QWRT（见 .github/patch_k2p_wifi_defaults.py）
#      2.4G：信道 11 / 功率 20% / K、V、R 全关
#      5G  ：信道 149 / 功率 40% / K、V 开、R 关（同 5G 带宽 20/40MHz）
#      —— 与主路由 QWRT 的 def_chan / def_txp / kvr 完全一致
#   4) 修好「自带定时重启」（见 .github/patch_k2p_watchdog_sched.py）
#      原版 watchdog.c 的门槛 `atoi(reboot_schedule) > 2359` 对 11 位纯数字串必然溢出
#      → 定时重启永不触发（真机 A/B 实测确认）
#   5) 修好「无线中继下电视盒子 / 智能电视拿不到 IPv6」（见 .github/patch_mtd_storage.py）
#      3-address 中继会改写客户端源 MAC，客户端自己的 DAD 探测被桥的组播泛洪绕回来
#      → 内核判定地址冲突 → dadfailed → 该地址永久不可用。
#      固件在启动时于无线口丢弃「源地址 :: 的 NS」（RFC 4862 规定的 DAD 唯一形式），
#      只拦这一种，RA / 正常 ND / mDNS / 投屏发现都不受影响。
#      手机用隐私地址（每次重试换 IID）所以逃得掉 —— 这就是「只有电视类设备中招」的原因。
#      默认只在 AP / 中继模式(sw_mode=2/3)生效；关掉：nvram set ipv6_dad_guard=0
#   另：K2P 出厂 2.4G/5G 改成**开放网络（无密码）**，删掉预置口令 1234567890
#
# 说明：
# - 这份 workflow 是照着上游自带的 .github/workflows/build.yml 改的
#   （依赖列表、Go/Node 环境、ccache 用法保持一致，只多了上面这些步骤），
#   文件名故意不叫 build.yml，避免把仓库自带的 workflow 覆盖掉。
# - 机型下拉默认 K2P-NANO —— 实测你两台 AP：/rom 版本 4.4.198.9、
#   没装 curl / ttyd / xray / shadowsocks（这几个只有完整版 K2P 才有），
#   所以现在跑的是 NANO 版。选错机型刷进去会出问题，别乱改。

on:
  workflow_dispatch:
    inputs:
      target:
        description: '要编译的机型（你的 AP 实测是 K2P-NANO，别改）'
        required: true
        default: 'K2P-NANO'
        type: choice
        options:
          - K2P-NANO
          - K2P
          - K2P-USB
  push:
    branches: [main]
    paths:
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 1) 取源码
        uses: actions/checkout@v4

      - name: 2) 确定机型
        run: |
          # 手动点 Run workflow 时用你选的；靠 push 自动触发时没得选，用默认值
          T='${{ github.event.inputs.target }}'
          [ -n "$T" ] || T='K2P-NANO'
          echo "TARGET=$T" >> "$GITHUB_ENV"
          echo "本次编译机型: $T"

      - name: 3) ccache（缓存编译中间产物：第二次编译会快很多）
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.event.inputs.target || 'K2P-NANO' }}-ap-fixes

      - name: 4) Go 环境（K2P 模板里有 go 写的程序，缺了会编译失败）
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          check-latest: true
          cache: false

      - name: 5) Node 环境（K2P 模板里有 AdGuardHome，缺了会编译失败）
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: 6) 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libtool-bin ccache curl cmake gperf gawk flex bison nano xxd \
            fakeroot kmod cpio bc zip git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libltdl-dev wget libc-dev-bin

      - name: 7) 打补丁：看门狗 + 可靠重启 + IPv6 修复写进固件
        run: |
          set -e
          # 优先取文件名就叫 mtd_storage.sh 的那个；取不到再退回第一个命中
          F=$(grep -rl 'func_fill()' trunk/ | grep 'mtd_storage\.sh$' | head -1)
          [ -n "$F" ] || F=$(grep -rl 'func_fill()' trunk/ | head -1)
          echo "目标文件: $F"
          test -n "$F"
          python3 .github/patch_mtd_storage.py "$F"

          echo "--- 校验 1/5：函数与调用点（应为 1 个定义 + 3 个调用）---"
          grep -n 'func_tsl_fixes' "$F"

          echo "--- 校验 2/5：补丁差异（开头 60 行）---"
          diff -u "$F.orig" "$F" | head -60 || true

          echo "--- 校验 3/5：IPv6 组播修复块必须烤进去（br0 snooping / disable_ipv6）---"
          grep -n 'ipv6-mcast-fix: v1' "$F"
          grep -q 'echo 0 > /sys/class/net/br0/bridge/multicast_snooping' "$F" \
            || { echo "!! 缺 br0 multicast_snooping=0，AP 上 5G 客户端的 IPv6 RA 会断"; exit 1; }
          grep -q 'ipv6/conf/\$_if/disable_ipv6' "$F" \
            || { echo "!! 缺 disable_ipv6=0 循环"; exit 1; }

          echo "--- 校验 4/5：IPv6 DAD 探测拦截块（无线中继下防 dadfailed）---"
          grep -n 'ipv6-dad-guard: v1' "$F"
          grep -q -- '--ip6-icmp-type 135' "$F" \
            || { echo "!! 缺 NS(type 135) 匹配 —— DAD 探测拦不下来"; exit 1; }
          grep -q -- '--ip6-src ::/128' "$F" \
            || { echo "!! 缺「源地址 ::」限定 —— 不加会把正常邻居发现也一起拦掉"; exit 1; }
          grep -q 'FORWARD 1 -j DADGUARD' "$F" \
            || { echo "!! DAD guard 没挂到 FORWARD 链"; exit 1; }
          # 该段在 rc 启动流程里直接执行：出现 exit / return 会把整机启动掐断 —— 硬拦。
          # 只看非注释行（注释里提到这两个词是正常的）。
          if awk '/ipv6-dad-guard: v1/,/ipv6-dad-guard <<</' "$F" \
               | grep -v '^[[:space:]]*#' \
               | grep -qE '(^|[;&|[:space:]])(exit|return)([[:space:]]|$)' ; then
            echo "!! DAD guard 段里出现 exit/return —— 会掐断 rc 启动流程，中止"; exit 1
          fi
          # /bin/sh 是 busybox，`command -v` 返回 127（实测），用它做守卫会让整段静默跳过。
          if awk '/ipv6-dad-guard: v1/,/ipv6-dad-guard <<</' "$F" \
               | grep -v '^[[:space:]]*#' \
               | grep -q 'command -v' ; then
            echo "!! 用了 command -v —— 本机 busybox sh 不支持(exit 127)，规则会静默不生效"; exit 1
          fi
          echo "OK：DAD guard 已烤进 started_script.sh（只拦源 :: 的 NS，RA/mDNS 不受影响）"

          echo "--- 校验 5/5：看门狗 v5 必须自带 DAD 防护自愈（否则无线重启后静默失效）---"
          # 实测：AP 做全量无线重启（保存无线设置 / radio*_restart）时内核会把
          # ebtables 卸掉，syslog 出现 "Ebtables v2.0 unregistered"，DADGUARD 连规则
          # 一起消失；started_script.sh 只在开机跑一次，不会重建 —— 故障静默复发。
          # v5 的 ap_watchdog.sh 每 30 秒核一次，缺了就重建。这几项缺一不可。
          grep -n 'watchdog-version: v5-generic' "$F"
          grep -q 'watchdog-version: v5-generic' "$F" \
            || { echo "!! 看门狗不是 v5 —— 无线重启后 DADGUARD 不会自动重建"; exit 1; }
          grep -q 'ensure_dad_guard()' "$F" \
            || { echo "!! 缺 ensure_dad_guard() 定义"; exit 1; }
          # 定义 1 处 + 调用 3 处（soft_recover 末尾 / check_once 开头 / 主循环分段等待）
          _ndg=$(grep -c 'ensure_dad_guard' "$F" || true)
          test "${_ndg:-0}" -ge 4 \
            || { echo "!! ensure_dad_guard 只有 ${_ndg:-0} 处（需 1 定义 + 3 调用）"; exit 1; }
          grep -q '_eb -L DADGUARD' "$F" \
            || { echo "!! 自愈里没有「核对链是否存在」的判据，会每轮盲重建"; exit 1; }
          grep -q 'ebtable_filter' "$F" \
            || { echo "!! 自愈缺 /proc/modules 快路径（模块被卸载时会白跑 ebtables）"; exit 1; }
          # 自愈里的循环变量必须与主循环 _w 不冲突，否则会把轮询计数改坏
          grep -q 'for _dk in 1 2 3' "$F" \
            || { echo "!! FORWARD 去重循环变量不是 _dk（会与主循环变量撞车）"; exit 1; }
          if grep -q 'watchdog-version: v4-generic' "$F" ; then
            echo "!! 残留 v4 标记 —— 已装 v4 的机器不会被升级成 v5"; exit 1
          fi
          echo "OK：看门狗 v5 自带 DADGUARD 自愈（30 秒粒度，重启无线后必补）"

          echo "--- 附加校验：reboot 兜底必须是 v5（平时 6 秒 / 刷机盯 mtd_write 自愈）---"
          grep -n 'sysrq-fallback: v' "$F"
          grep -q 'sysrq-fallback: v5' "$F" \
            || { echo "!! shutdown_script 不是 v5，中止"; exit 1; }
          # 只看兜底块本身：ap_watchdog.sh 正文里也有 sysrq 语句，全局 grep 会误判
          _SHB=$(awk '/sysrq-fallback: v5/,/sysrq-fallback <<</' "$F")
          echo "$_SHB" | grep -q 'mtd_write' \
            || { echo "!! 刷机兜底没有判 mtd_write 是否仍在写盘（v5）"; exit 1; }
          echo "$_SHB" | grep -q '_idle' \
            || { echo "!! 刷机兜底不是「进程退出 6 秒后接管」的自适应写法"; exit 1; }
          echo "$_SHB" | grep -q 'echo b > /proc/sysrq-trigger' \
            || { echo "!! 兜底里没有 sysrq-b"; exit 1; }
          # v4 的致命缺陷：先 s 后 b，flash 写卡住时 s 会永久阻塞，b 永远发不出去
          if echo "$_SHB" | grep -q 'echo s > /proc/sysrq-trigger' ; then
            echo "!! 兜底里还有 sysrq-s —— 写卡住时会把整条兜底堵死（v5 改成后台 sync）"; exit 1
          fi
          if grep -qE 'sysrq-fallback: v(3|4)' "$F" ; then
            echo "!! 残留 v3/v4 标记，说明旧块没清干净"; exit 1
          fi
          # func_tsl_fixes 里出现 nvram 调用会触发 fill 阶段死锁（整机卡启动），硬拦。
          # 判据必须「跳过 heredoc 正文 + 跳过注释行」：
          #   heredoc 正文里的 `case "$(nvram get sw_mode)"` 是 ap_watchdog.sh 的内容，
          #   运行时才执行，不算函数体内调用；注释里出现 nvram 字样也不算。
          echo "--- 附加校验：func_tsl_fixes 函数体内不得真正执行 nvram（fill 阶段会死锁）---"
          awk '
            /^func_tsl_fixes\(\)/ { inf = 1 }
            inf && /<<.TSLEOF.$/ { skip = 1 ; next }
            skip && /^TSLEOF$/ { skip = 0 ; next }
            inf && /^# ===== end of tsl baked-in fixes =====/ { exit }
            inf && !skip && $0 !~ /^[[:space:]]*#/ { print }
          ' "$F" | grep -nE 'nvram[[:space:]]+(get|set|commit|unset|show)' \
            && { echo "!! func_tsl_fixes 里出现 nvram 调用 —— fill 阶段会死锁，中止"; exit 1; } || true

      - name: 8) 打补丁：K2P 的 5G/2.4G 高级默认值对齐实测配置 + 出厂开放网络
        run: |
          set -e
          # 把「实测在用的那套无线高级参数」烤进固件的 nvram 默认值表
          # （trunk/user/shared/src/defaults.c），做到「恢复出厂即带」：
          #   1) wl_HT_BW        2(20/40/80MHz) -> 1(20/40MHz)   —— 5G 对齐 VHT40
          #   2) wl_wme          1(开) -> 0(关)                   —— 5G WMM 对齐 QWRT
          #   3) wl/rt_country_code 默认 -> "CN"                  —— 两频段钉 CN
          #   4) rt_wme          1(开) -> 0(关)                   —— 2.4G WMM 对齐 QWRT
          #   5) rt_channel      0(auto) -> 11                    —— 2.4G 信道默认钉 11
          #   6) rt_HT_80211KV   1(开) -> 0(关)                   —— 2.4G KV 关，对齐 QWRT
          #   7) wl_channel      0(auto) -> 149                   —— 5G 信道默认钉 149
          #   8) rt_TxPower      100 -> 20                        —— 2.4G 功率默认 20%
          #   9) wl_TxPower      100 -> 40                        —— 5G 功率默认 40%
          #  10) wl/rt_auth_mode "psk" -> "open"、wl/rt_wpa_psk -> ""
          #      → K2P 出厂 2.4G/5G 即开放网络（无密码），删掉预置口令 1234567890
          # 终局（与主路由 QWRT 完全一致）：
          #   2.4G = 信道 11 / 功率 20 / K,V,R 全关
          #   5G   = 信道 149 / 功率 40 / K,V 开、R 关
          # 只影响 K2P；其它机型的这些默认值完全不变。幂等。
          D="trunk/user/shared/src/defaults.c"
          test -f "$D"
          grep -n -B2 -A4 'wl_HT_BW' "$D" || true
          python3 .github/patch_k2p_wifi_defaults.py "$D"

          echo "--- 校验 1/15：wl_HT_BW 的 K2P 分支 ---"
          grep -n -A4 'BOARD_HAS_5G_11AC && !defined(BOARD_K2P)' "$D"
          grep -q 'BOARD_HAS_5G_11AC && !defined(BOARD_K2P)' "$D" || { echo "!! wl_HT_BW 补丁没打上，中止"; exit 1; }
          echo "--- 校验 2/15：K2P 的 wl_wme=0 ---"
          grep -n -B1 -A4 '"wl_wme", "0"' "$D"
          grep -q '"wl_wme", "0"' "$D" || { echo "!! wl_wme 没改成 0，中止"; exit 1; }
          echo "--- 校验 3/15：K2P 的 wl_country_code=CN ---"
          grep -q '"wl_country_code", "CN"' "$D" || { echo "!! 5G 国家码没钉成 CN，中止"; exit 1; }
          echo "--- 校验 4/15：K2P 的 rt_wme=0（2.4G WMM 对齐 QWRT）---"
          grep -n -B1 -A2 '"rt_wme", "0"' "$D"
          grep -q '"rt_wme", "0"' "$D" || { echo "!! rt_wme 没改成 0，中止"; exit 1; }
          echo "--- 校验 5/15：K2P 的 rt_channel=11（2.4G 信道默认钉 11）---"
          grep -n -B1 -A2 '"rt_channel", "11"' "$D"
          grep -q '"rt_channel", "11"' "$D" || { echo "!! rt_channel 没钉成 11，中止"; exit 1; }
          echo "--- 校验 6/15：K2P 的 rt_HT_80211KV=0（2.4G KV 关，对齐 QWRT）---"
          grep -n -B1 -A2 '"rt_HT_80211KV", "0"' "$D"
          grep -q '"rt_HT_80211KV", "0"' "$D" || { echo "!! rt_HT_80211KV 没改成 0，中止"; exit 1; }
          echo "--- 校验 7/15：K2P 的 rt_country_code=CN ---"
          grep -q '"rt_country_code", "CN"' "$D" || { echo "!! 2.4G 国家码没钉成 CN，中止"; exit 1; }
          echo "--- 校验 8/15：K2P 的 rt_TxPower=20（2.4G 功率 20%，与 QWRT 一致）---"
          grep -n -B1 -A2 '"rt_TxPower", "20"' "$D"
          grep -q '"rt_TxPower", "20"' "$D" || { echo "!! 2.4G 默认功率没改成 20，中止"; exit 1; }
          echo "--- 校验 9/15：K2P 的 wl_TxPower=40（5G 功率 40%，与 QWRT 一致）---"
          grep -n -B1 -A2 '"wl_TxPower", "40"' "$D"
          grep -q '"wl_TxPower", "40"' "$D" || { echo "!! 5G 默认功率没改成 40，中止"; exit 1; }
          echo "--- 校验 10/15：K2P 出厂 5G 不加密 ---"
          grep -q '{ "wl_auth_mode", "open" },' "$D" || { echo "!! 5G auth_mode 没改成 open，中止"; exit 1; }
          grep -q '{ "wl_wpa_psk", "" },' "$D" || { echo "!! 5G 预置口令没清空，中止"; exit 1; }
          echo "--- 校验 11/15：K2P 出厂 2.4G 不加密 ---"
          grep -q '{ "rt_auth_mode", "open" },' "$D" || { echo "!! 2.4G auth_mode 没改成 open，中止"; exit 1; }
          grep -q '{ "rt_wpa_psk", "" },' "$D" || { echo "!! 2.4G 预置口令没清空，中止"; exit 1; }
          echo "--- 校验 12/15：原厂 psk 宏只应剩在非 K2P 分支（各 1 处）---"
          test "$(grep -c 'DEF_WLAN_5G_PSK' "$D")" = "1" || { echo "!! DEF_WLAN_5G_PSK 不是 1 处，中止"; exit 1; }
          test "$(grep -c 'DEF_WLAN_2G_PSK' "$D")" = "1" || { echo "!! DEF_WLAN_2G_PSK 不是 1 处，中止"; exit 1; }
          echo "--- 校验 13/15：K2P 的 wl_channel=149（5G 默认信道钉 149）---"
          grep -n -B1 -A2 '"wl_channel", "149"' "$D"
          grep -q '"wl_channel", "149"' "$D" || { echo "!! 5G 默认信道没钉成 149，中止"; exit 1; }
          echo "--- 校验 14/15：K/V/R 终局（2.4G 0/0/0，5G 1/1/0，R 两频段都关）---"
          grep -q '"wl_HT_80211KV", "1"' "$D" || { echo "!! 5G 的 K/V 没开，中止"; exit 1; }
          grep -q '"rt_HT_80211R", "0"' "$D" || { echo "!! 2.4G 的 802.11R 不是 0，中止"; exit 1; }
          grep -q '"wl_HT_80211R", "0"' "$D" || { echo "!! 5G 的 802.11R 不是 0，中止"; exit 1; }
          echo "--- 校验 15/15：预处理块必须成对，否则会把后面整段吃掉 ---"
          test "$(grep -c '^#ifdef BOARD_K2P' "$D")" = "13" || { echo "!! #ifdef BOARD_K2P 不是 13 处（应为 6 旧 + 7 新），中止"; exit 1; }
          rm -f "$D.orig"

      - name: 8b) 打补丁：修好「自带定时重启」永不触发的门槛
        run: |
          set -e
          # 上游 watchdog.c 的门槛 `strlen(...)==11 && atoi(reboot_schedule) > 2359`
          # 对网页界面写出的 11 位纯数字串必然溢出 int -> 条件恒假 -> 定时重启永不触发。
          # 真机 A/B 实测：11 位纯数字串永不触发；把 atoi 只喂后 4 位时立刻按时重启。
          W="trunk/user/rc/src/watchdog.c"
          if [ ! -f "$W" ]; then
            W="$(find trunk/user -type f -name watchdog.c | head -n 1)"
            echo "!! 预期路径不在，已自动定位到：$W"
          fi
          [ -n "$W" ] && [ -f "$W" ] || { echo "!! 仓库里找不到 watchdog.c，中止"; exit 1; }

          echo "--- 改之前 ---"
          grep -n -B1 -A1 'atoi(reboot_schedule)' "$W" || true
          python3 .github/patch_k2p_watchdog_sched.py "$W"

          echo "--- 校验 1/3：新的 HHMM 校验在位 ---"
          grep -q 'atoi(reboot_schedule + 7) <= 2359' "$W" \
            || { echo "!! 定时重启门槛没修好，中止"; exit 1; }
          echo "--- 校验 2/3：老的溢出写法必须消失（按整行匹配，避免误伤注释）---"
          if grep -qE '^[[:space:]]*if \(strlen\(reboot_schedule\) == 11 && atoi\(reboot_schedule\) > 2359\)' "$W" ; then
            echo "!! 老的错误条件还在，中止"; exit 1
          fi
          echo "--- 校验 3/3：nvram 键名与结构未被我改动 ---"
          grep -q 'nvram_match("reboot_schedule_enable", "1")' "$W" || { echo "!! 结构被破坏，中止"; exit 1; }
          grep -q 'nvram_match("ntp_ready", "1")' "$W" || { echo "!! 结构被破坏，中止"; exit 1; }
          echo "OK：定时重启的门槛已修好（改前改后只差这一个比较表达式）"

      - name: 9) 去掉「QoS 限速」(SQM)：包 / 网页 / 菜单一起下掉
        run: |
          set -e
          CFG="trunk/configs/templates/$TARGET.config"
          test -f "$CFG" || { echo "找不到模板 $CFG"; exit 1; }

          echo "--- 改之前 ---"
          grep -n 'INCLUDE_SQM\|INCLUDE_QOS' "$CFG" || true

          # SQM = 网页里的「QoS 限速」那个功能；关掉后：
          #   user/cflags.mk 不再定义 APP_SQM -> httpd 的 found_app_sqm() 返回 0
          #   -> 菜单项「QoS 限速」不显示；www/Makefile 会自动删掉 Advanced_SQM.asp；
          #   user/Makefile 里 dir_$(CONFIG_FIRMWARE_INCLUDE_SQM) 为空 -> 不编译 sqm-qos 包。
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SQM=.*/CONFIG_FIRMWARE_INCLUDE_SQM=n/' "$CFG"
          # 顺带把老式 QoS 模块也确保关掉（原本就是 n）
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_QOS=.*/CONFIG_FIRMWARE_INCLUDE_QOS=n/' "$CFG"

          echo "--- 改之后 ---"
          grep -n 'INCLUDE_SQM\|INCLUDE_QOS' "$CFG"
          grep -q '^CONFIG_FIRMWARE_INCLUDE_SQM=n$' "$CFG" || { echo "!! SQM 没关掉，中止"; exit 1; }
          echo "OK：这次编出来的固件不含 QoS 限速"

      - name: 10) 编译
        run: |
          make "$TARGET" TOOLCHAIN=mipsel-linux-musl 2>&1 | tail -n 200

      - name: 11) 看产物 + 改名 + 复核
        run: |
          if [ "$TARGET" = "K2P-NANO" ]; then
            for image in trunk/images/*.trx ; do
              [ -e "$image" ] || continue
              mv "$image" "$(echo "$image" | sed 's/K2P/K2P-NANO/')"
            done
          fi
          echo "--- 最终产物 ---"
          ls -lh trunk/images/
          md5sum trunk/images/*.trx || true

          echo "--- 复核 1：QoS 限速页面应已不在固件里 ---"
          if [ -e trunk/romfs/www/Advanced_SQM.asp ] ; then
            echo "!! 警告：Advanced_SQM.asp 还在，说明没删干净"
          else
            echo "OK：固件 www 里没有 Advanced_SQM.asp"
          fi
          echo "--- 复核 2：看门狗脚本应已打进 storage 模板 ---"
          grep -c 'watchdog-version: v5-generic' trunk/user/scripts/files/sbin/mtd_storage.sh || true
          grep -c 'ensure_dad_guard' trunk/user/scripts/files/sbin/mtd_storage.sh || true
          echo "--- 复核 3：无线默认值应与主路由 QWRT 一致 ---"
          echo "    2.4G：信道 11 / 功率 20 / K,V,R 全关；5G：信道 149 / 功率 40 / K,V 开、R 关"
          grep -n -A4 'BOARD_HAS_5G_11AC && !defined(BOARD_K2P)' trunk/user/shared/src/defaults.c || true
          grep -n -B1 -A2 '"rt_TxPower", "20"' trunk/user/shared/src/defaults.c || true
          grep -n -B1 -A2 '"wl_TxPower", "40"' trunk/user/shared/src/defaults.c || true
          grep -n -B1 -A2 '"rt_HT_80211KV", "0"' trunk/user/shared/src/defaults.c || true
          grep -n -B1 -A2 '"wl_HT_80211KV", "1"' trunk/user/shared/src/defaults.c || true
          echo "--- 复核 4：K2P 出厂双频都是开放网络（无密码）---"
          grep -n -B1 -A4 '"wl_wpa_psk", ""' trunk/user/shared/src/defaults.c || true
          grep -n -B1 -A4 '"rt_wpa_psk", ""' trunk/user/shared/src/defaults.c || true
          echo "--- 复核 5：定时重启门槛已修好（不应再出现老写法）---"
          # GitHub 的 run 默认 bash -e：任何 grep 落空都会把整个步骤判失败。
          # 展示用的 grep 一律 || true；只有「老写法还在」才真的 exit 1。
          # trunk 里可能不止一个 watchdog.c（内核树也有同名文件），所以逐个遍历。
          for W2 in $(find trunk/user -type f -name watchdog.c); do
            echo "检查 $W2 :"
            grep -n 'atoi(reboot_schedule' "$W2" || true
            if grep -qE '^[[:space:]]*if \(strlen\(reboot_schedule\) == 11 && atoi\(reboot_schedule\) > 2359\)' "$W2" ; then
              echo "!! 警告：定时重启的老写法还在（$W2），说明补丁没生效"; exit 1
            fi
          done

      - name: 12) 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}-firmware
          path: trunk/images/*.trx
          if-no-files-found: error
